[project]
name = "counsel-deid"
version = "0.1.0"
description = "De-identify psychotherapy transcripts for AI training data: Presidio baseline, sheet-guided Claude rewrite, rule + Jev evaluation"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["counsel_deid*"]
